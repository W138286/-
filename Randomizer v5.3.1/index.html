<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>无序打乱器</title>
    <script>
      if (window.location.protocol === 'file:' && !window.location.pathname.endsWith('offline.html')) {
        var path = window.location.pathname;
        var offlinePath = path.substring(0, path.lastIndexOf('/') + 1) + 'offline.html';
        window.location.replace('file://' + offlinePath + window.location.hash);
      }
    </script>
    <script>
      // LocalStorage shim for file:// protocol restricted environments (like some offline browsers)
      try {
        localStorage.getItem("test");
      } catch (e) {
        console.warn("LocalStorage restricted, using memory shim.");
        var memoryStore = {};
        window.localStorage = {
          getItem: function (key) {
            return memoryStore[key] || null;
          },
          setItem: function (key, val) {
            memoryStore[key] = val;
          },
          removeItem: function (key) {
            delete memoryStore[key];
          },
          clear: function () {
            memoryStore = {};
          },
        };
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #000; color: #fff; font-family: sans-serif;">
        <div style="text-align: center;">
          <div style="width: 40px; height: 40px; border: 3px solid #333; border-top: 3px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
          <p id="loading-text">正在启动练习器...</p>
          <script>
            setTimeout(function() {
              var text = document.getElementById('loading-text');
              if (text) {
                var isFile = window.location.protocol === 'file:';
                if (isFile) {
                   text.innerHTML = '您似乎正在双击打开源码的主文件（<code>index.html</code>）。<br><br><span style="font-size: 14px; color: #ffaa00;">提示：此文件无法直接在本地运行，因为它的代码需要在服务器环境下才能加载。<br>如果您下载了ZIP代码包并想在本地运行，请双击打开 <b><code>offline.html</code></b> 这个单文件离线版本，它包含了所有所需的打包代码。</span>';
                } else {
                   text.innerHTML = '脚本加载较慢，请稍候...<br><span style="font-size: 12px; color: #666;">(如果长时间停留在该页面，可能是因为浏览器版本过低或禁用了 JavaScript)</span>';
                }
              }
            }, 3000);
          </script>
        </div>
      </div>
    </div>
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script>
      // Global error handler to catch boot errors
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var root = document.getElementById('root');
        // We only show the error if the loading indicator is still there (meaning React hasn't replaced it)
        if (root && (root.innerHTML.indexOf('正在启动') !== -1 || root.innerHTML.indexOf('脚本加载较慢') !== -1)) {
          root.innerHTML = '<div style="padding: 20px; color: #ff4444; background: #000; min-height: 100vh; font-family: monospace; white-space: pre-wrap; word-break: break-all;">' +
            '<h2 style="margin-top: 0;">启动失败 (Initialization Error)</h2>' +
            '<div style="background: #1a1a1a; padding: 15px; border-radius: 8px; border-left: 4px solid #ff4444;">' +
            '<strong>Error:</strong> ' + msg + '<br><br>' +
            '<strong>Details:</strong> ' + (url ? '\nFile: ' + url : '') + (lineNo ? '\nLine: ' + lineNo : '') + '<br><br>' +
            '<strong>Stack Trace:</strong>\n' + (error && error.stack ? error.stack : 'No stack trace available') + 
            '</div>' +
            '<p style="margin-top: 20px; font-size: 14px; color: #999;">提示：如果您是下载了ZIP源码并在本地打开，请改为双击打开 <strong>offline.html</strong>。</p>' +
            '</div>';
        }
        return false;
      };
      window.onunhandledrejection = function(event) {
        var root = document.getElementById('root');
        if (root && (root.innerHTML.indexOf('正在启动') !== -1 || root.innerHTML.indexOf('脚本加载较慢') !== -1)) {
          root.innerHTML = '<div style="padding: 20px; color: #ffbb33; background: #000; min-height: 100vh; font-family: monospace;">' +
            '<h2>Promise Rejection</h2>' +
            '<p>' + event.reason + '</p>' +
            '</div>';
        }
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
